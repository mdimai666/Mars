# Публикация NuGet-пакетов в NuGet.org через Trusted Publishing (OIDC, без API-ключей).
# Настройка на nuget.org: учётка -> Trusted Publishing -> политика: owner, репозиторий mdimai666/Mars,
# workflow-файл nuget-publish.yml. В секретах репозитория: NUGET_USER (имя профиля nuget.org, не email).
# Публикуются все проекты src/**, объявившие <PackageId>; версия берётся из MarsAppVersion (Directory.Build.props).
name: Publish NuGet packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4.3.0
        with:
          dotnet-version: '10.0'

      - name: Restore
        run: dotnet restore Mars.slnx

      # Mars.Plugin.Sdk пакует манифесты из вывода сборки Mars.WebApp — решение должно быть собрано.
      - name: Build solution
        run: dotnet build Mars.slnx -c Release --no-restore

      - name: Pack packages (projects with PackageId)
        run: |
          set -e
          mkdir -p artifacts
          while IFS= read -r f; do
            if grep -q '<PackageId>' "$f"; then
              echo "Packing: $f"
              dotnet pack "$f" -c Release --no-restore -o artifacts \
                -p:ContinuousIntegrationBuild=true -p:DebugType=portable -p:DebugSymbols=true
            fi
          done < <(find src -name '*.csproj')

      - name: NuGet login (Trusted Publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push packages
        run: dotnet nuget push artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
